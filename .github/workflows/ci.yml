name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEXUS_TEST_DATABASE_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus_test
      PYTHONPATH: src:.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run --no-sync ruff check src tests evals
      - name: Ruff format
        run: uv run --no-sync ruff format --check src tests evals
      - name: mypy
        run: uv run --no-sync mypy
      - name: Tests (deterministic fixture LLM, real Postgres + pgvector)
        run: uv run --no-sync pytest -q --cov=nexus --cov-report=term

  evals:
    # Deliberately has no service containers: proves the deterministic gates and their tests need no Postgres,
    # Redis, model, search engine or API key. API and live-model checks are reported as explicit skips here.
    name: Evaluation gates · offline
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
      EVAL_OUT: ${{ github.workspace }}/eval-reports
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Offline tests (gate logic and real CLI exit codes; no services)
        run: uv run --no-sync pytest -m offline -q
      - name: Deterministic evaluation gate (fails the job on any failed, errored or invalid check)
        run: uv run --no-sync python -m evals.run --offline --output-dir "$EVAL_OUT"
      - name: Upload evaluation reports
        # Runs after a gate failure too, so the failing report is inspectable; it cannot change the job result.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: eval-reports/
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API / worker image
        uses: docker/build-push-action@v6
        with: { context: backend, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Web image
        uses: docker/build-push-action@v6
        with: { context: frontend, push: false }
      - name: Compose file is valid
        run: cp .env.example .env && docker compose --profile app config -q

  security:
    name: Secret scan and docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Validate Mermaid diagrams
        run: node scripts/check-mermaid.mjs
